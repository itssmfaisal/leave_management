services:
  leave-report:
    build: .
    ports:
      # Override with APP_PORT in .env, e.g. APP_PORT=127.0.0.1:8080 behind a reverse proxy.
      - "${APP_PORT:-8080}:8080"
    environment:
      TZ: Asia/Dhaka   # "today's date" on the letter uses this time zone
    volumes:
      - leave-data:/data   # SQLite database lives here
    restart: unless-stopped

volumes:
  leave-data:
